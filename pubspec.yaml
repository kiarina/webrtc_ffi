name: webrtc_ffi
description: >-
  WebRTC for Dart without Flutter: peer connections, data channels and media
  tracks (RTP with packetizers) through libdatachannel and dart:ffi, built
  from source by the package's build hook.
version: 0.1.0-dev
repository: https://github.com/kiarina/webrtc_ffi
issue_tracker: https://github.com/kiarina/webrtc_ffi/issues
topics: [webrtc, datachannel, rtp, ffi, p2p]

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0

dev_dependencies:
  async: ^2.13.1
  lints: ^6.1.0
  test: ^1.33.0
